[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aircraft-pm"
version = "0.1.0"
description = "Aircraft engine predictive maintenance demo pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1,<3",
  "pyarrow>=16,<19",
  "h5py>=3.10,<4",
  "kafka-python>=2.0,<3",
  "clickhouse-connect>=0.7,<0.9",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5,<3.6"]
dev = [
  "pytest>=8.2,<9",
  "ruff>=0.6,<0.8",
]

[project.scripts]
aircraft-convert = "aircraft_pm.converter:main"
aircraft-replay = "aircraft_pm.producer:main"
aircraft-status = "aircraft_pm.observability:main"
aircraft-batch = "aircraft_pm.jobs.batch_job:main"
aircraft-stream = "aircraft_pm.jobs.streaming_job:main"
aircraft-train = "aircraft_pm.jobs.ml_train:main"
aircraft-predict = "aircraft_pm.jobs.ml_predict:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
